{% extends 'hr/base.html' %}
{% block content %}
<div class="small-form">
    <h1>Mot de passe oublié</h1>
    <p class="text-secondary">Saisissez votre adresse e-mail. Si l’adresse correspond à un compte existant, un lien de réinitialisation vous sera envoyé.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100">Envoyer le lien</button>
    </form>
</div>
{% endblock %}
